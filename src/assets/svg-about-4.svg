<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="ui-monospace, monospace">
  <!-- About 04 — What's next: the climb -->

  <!-- stars -->
  <circle cx="40"  cy="50"  r="2"   fill="#E2E8F0" opacity="0.5"/>
  <circle cx="110" cy="90"  r="1.5" fill="#E2E8F0" opacity="0.4"/>
  <circle cx="300" cy="40"  r="2"   fill="#E2E8F0" opacity="0.5"/>
  <circle cx="360" cy="110" r="1.5" fill="#E2E8F0" opacity="0.4"/>
  <circle cx="250" cy="80"  r="1.5" fill="#8ECAE6" opacity="0.5"/>
  <circle cx="330" cy="70"  r="16"  fill="#8ECAE6" opacity="0.08"/>
  <circle cx="330" cy="70"  r="9"   fill="#8ECAE6" opacity="0.35"/>

  <!-- far ridge -->
  <polygon points="0,330 90,250 150,290 230,210 310,270 400,220 400,380 0,380" fill="#12121A"/>
  <!-- main mountain -->
  <polygon points="20,380 196,124 270,226 304,196 390,380" fill="#1a1a2e" stroke="#2d2d4e" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="196,124 222,162 206,158 194,170 180,156 170,162" fill="#E2E8F0" opacity="0.18"/>

  <!-- switchback trail -->
  <path d="M80,370 L230,330 L120,290 L240,250 L170,210 L196,128"
        fill="none" stroke="#8ECAE6" stroke-width="2" stroke-dasharray="5 7" stroke-linecap="round" opacity="0.8"/>

  <!-- milestones -->
  <circle cx="230" cy="330" r="6" fill="#0A0A0F" stroke="#A7F3D0" stroke-width="2"/>
  <rect x="244" y="319" width="74" height="22" rx="11" fill="#12121A" stroke="#2d2d4e"/>
  <text x="281" y="334" text-anchor="middle" font-size="10" fill="#A7F3D0">harder DSA</text>

  <circle cx="120" cy="290" r="6" fill="#0A0A0F" stroke="#A7F3D0" stroke-width="2"/>
  <rect x="24" y="279" width="84" height="22" rx="11" fill="#12121A" stroke="#2d2d4e"/>
  <text x="66" y="294" text-anchor="middle" font-size="10" fill="#A7F3D0">AI/ML depth</text>

  <circle cx="240" cy="250" r="6" fill="#0A0A0F" stroke="#8ECAE6" stroke-width="2"/>
  <rect x="254" y="239" width="96" height="22" rx="11" fill="#12121A" stroke="#2d2d4e"/>
  <text x="302" y="254" text-anchor="middle" font-size="10" fill="#8ECAE6">2027 SWE intern</text>

  <!-- summit flag -->
  <line x1="196" y1="126" x2="196" y2="84" stroke="#94A3B8" stroke-width="2"/>
  <path d="M196,84 L226,94 L196,104 Z" fill="#A7F3D0"/>

  <!-- climber -->
  <circle cx="170" cy="198" r="7" fill="#FDBCB4"/>
  <path d="M163,195 Q170,186 177,195" fill="#2C2C2C"/>
  <rect x="164" y="205" width="12" height="15" rx="4" fill="#2d2d4e"/>
  <rect x="174" y="206" width="8" height="11" rx="2" fill="#8ECAE6" opacity="0.8"/>
  <line x1="167" y1="220" x2="162" y2="230" stroke="#2C2C2C" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="173" y1="220" x2="178" y2="229" stroke="#2C2C2C" stroke-width="3.5" stroke-linecap="round"/>

  <text x="200" y="408" text-anchor="middle" font-size="10" fill="#94A3B8">next</text>
</svg>
