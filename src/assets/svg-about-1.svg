<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="ui-monospace, monospace">
  <!-- About 01 — Who I am: the road from home to IIT (ISM) -->

  <!-- sky dots -->
  <circle cx="40"  cy="60"  r="2.5" fill="#8ECAE6" opacity="0.35"/>
  <circle cx="120" cy="40"  r="2"   fill="#A7F3D0" opacity="0.35"/>
  <circle cx="230" cy="70"  r="2.5" fill="#8ECAE6" opacity="0.30"/>
  <circle cx="375" cy="160" r="2"   fill="#A7F3D0" opacity="0.30"/>
  <circle cx="30"  cy="220" r="2"   fill="#8ECAE6" opacity="0.25"/>

  <!-- the road -->
  <path d="M62,372 C150,372 120,300 196,296 C268,292 300,250 252,196 C214,154 282,118 334,104"
        fill="none" stroke="#2d2d4e" stroke-width="14" stroke-linecap="round"/>
  <path d="M62,372 C150,372 120,300 196,296 C268,292 300,250 252,196 C214,154 282,118 334,104"
        fill="none" stroke="#8ECAE6" stroke-width="2" stroke-dasharray="6 9" stroke-linecap="round" opacity="0.7"/>

  <!-- 1 · home -->
  <rect x="36" y="338" width="52" height="38" rx="3" fill="#12121A" stroke="#2d2d4e" stroke-width="2"/>
  <polygon points="30,341 62,314 94,341" fill="#2d2d4e"/>
  <rect x="55" y="354" width="14" height="22" rx="2" fill="#1a1a2e"/>
  <rect x="42" y="347" width="9" height="9" rx="1.5" fill="#FEE440" opacity="0.7"/>
  <rect x="73" y="347" width="9" height="9" rx="1.5" fill="#FEE440" opacity="0.7"/>
  <text x="62" y="398" text-anchor="middle" font-size="11" fill="#94A3B8">home</text>

  <!-- 2 · school (book stack) -->
  <rect x="172" y="262" width="50" height="10" rx="2" fill="#8ECAE6" opacity="0.85"/>
  <rect x="176" y="272" width="44" height="10" rx="2" fill="#A7F3D0" opacity="0.85"/>
  <rect x="170" y="282" width="52" height="10" rx="2" fill="#C4B5FD" opacity="0.8"/>
  <line x1="180" y1="267" x2="214" y2="267" stroke="#0A0A0F" stroke-width="1" opacity="0.5"/>
  <text x="196" y="322" text-anchor="middle" font-size="11" fill="#94A3B8">school</text>

  <!-- small figure walking the road -->
  <circle cx="128" cy="326" r="8" fill="#FDBCB4"/>
  <path d="M120,322 Q128,312 136,322" fill="#2C2C2C"/>
  <rect x="121" y="334" width="14" height="18" rx="5" fill="#2d2d4e"/>
  <rect x="133" y="336" width="9" height="12" rx="2" fill="#8ECAE6" opacity="0.8"/>
  <line x1="125" y1="352" x2="121" y2="364" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="131" y1="352" x2="136" y2="363" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>

  <!-- 3 · JEE exam sheet -->
  <g transform="rotate(-6 252 196)">
    <rect x="226" y="160" width="52" height="64" rx="4" fill="#12121A" stroke="#8ECAE6" stroke-width="1.6"/>
    <text x="252" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#8ECAE6">JEE</text>
    <line x1="234" y1="188" x2="270" y2="188" stroke="#2d2d4e" stroke-width="2"/>
    <line x1="234" y1="197" x2="264" y2="197" stroke="#2d2d4e" stroke-width="2"/>
    <line x1="234" y1="206" x2="268" y2="206" stroke="#2d2d4e" stroke-width="2"/>
    <path d="M258,212 l5,5 l10,-12" fill="none" stroke="#A7F3D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="300" y="232" font-size="10" fill="#94A3B8">AIR 3012</text>

  <!-- 4 · IIT (ISM) campus -->
  <polygon points="300,96 342,74 384,96" fill="#2d2d4e"/>
  <rect x="304" y="96" width="76" height="6" fill="#1a1a2e"/>
  <rect x="310" y="102" width="6" height="30" fill="#12121A" stroke="#2d2d4e" stroke-width="1.2"/>
  <rect x="326" y="102" width="6" height="30" fill="#12121A" stroke="#2d2d4e" stroke-width="1.2"/>
  <rect x="352" y="102" width="6" height="30" fill="#12121A" stroke="#2d2d4e" stroke-width="1.2"/>
  <rect x="368" y="102" width="6" height="30" fill="#12121A" stroke="#2d2d4e" stroke-width="1.2"/>
  <rect x="300" y="132" width="84" height="6" rx="1" fill="#2d2d4e"/>
  <line x1="342" y1="74" x2="342" y2="46" stroke="#94A3B8" stroke-width="1.6"/>
  <path d="M342,46 L364,53 L342,60 Z" fill="#A7F3D0"/>
  <text x="342" y="156" text-anchor="middle" font-size="11" fill="#8ECAE6">IIT (ISM)</text>
</svg>
